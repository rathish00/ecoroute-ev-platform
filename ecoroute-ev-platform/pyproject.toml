[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoroute-ev-platform"
version = "1.0.0"
description = "Eco-Routing & Dynamic EV Charging Logistics Engine -- energy-aware routing, non-linear battery ML, and grid-aware charge dispatch for commercial EV fleets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "EcoRoute Contributors" }]
keywords = ["electric-vehicles", "fleet-logistics", "routing", "optimization", "machine-learning", "smart-grid"]

dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "networkx>=3.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
ml = ["xgboost>=2.0"]
optimizer = ["pulp>=2.7"]
weather = ["h3>=3.7,<4.0"]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "black>=24.0", "ruff>=0.4"]
all = ["ecoroute-ev-platform[ml,optimizer,weather,dashboard,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
